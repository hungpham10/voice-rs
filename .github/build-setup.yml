# Steps injected by cargo-dist into the `build-local-artifacts` job, right after
# checkout. Fetches the source models so the `voice-hubert` build script can
# codegen, and turns on weight embedding so the shipped `embed` binary is
# self-contained (no `.bpk` file needed at runtime).
- name: Fetch model assets (ONNX)
  run: ./scripts/fetch_assets.sh
- name: Embed ContentVec weights into the `embed` binary
  run: echo "VOICE_EMBED_WEIGHTS=1" >> "$GITHUB_ENV"
