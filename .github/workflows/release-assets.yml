name: release-assets

# Kéo trọng số gốc (VITS checkpoint từ Google Drive, ContentVec ONNX từ HuggingFace),
# export `dec`, sinh features mẫu, rồi ĐÓNG GÓI thành một bundle duy nhất và publish
# lên GitHub Release. Colab chỉ cần tải bundle này (xem `scripts/fetch_assets.sh`).
#
# Chạy tay: Actions → release-assets → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag để publish bundle"
        default: assets-v1
      drive_folder:
        description: "Google Drive folder chứa pretrained_ljs.pth"
        default: "https://drive.google.com/drive/folders/1ksarh-cJf3F5eKJjLVWY0X1j1qsQqiS2?usp=sharing"
      contentvec_onnx:
        description: "URL ContentVec ONNX (HubertModelWithFinalProj, 768)"
        default: "https://huggingface.co/TigreGotico/voiceclonnx-rvc/resolve/main/contentvec_768l12.onnx"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Kéo trọng số gốc
        run: |
          set -euo pipefail
          mkdir -p sources/onnx_hubert_new
          pip install --quiet gdown
          gdown --folder "${{ inputs.drive_folder }}" -O drive_dl
          find drive_dl -name 'pretrained_ljs.pth' -exec mv {} sources/pretrained_ljs.pth \;
          test -f sources/pretrained_ljs.pth || { echo "không tìm thấy pretrained_ljs.pth trong Drive folder"; exit 1; }
          curl -L --fail -o sources/onnx_hubert_new/model.onnx "${{ inputs.contentvec_onnx }}"
          ls -lh sources/pretrained_ljs.pth sources/onnx_hubert_new/model.onnx

      - name: Export trọng số dec + kiểm vật lý
        run: |
          set -euo pipefail
          pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu
          python scripts/export_vits_dec.py --hps scripts/ljs_base.json

      - name: Sinh features ContentVec cho wav mẫu
        run: |
          set -euo pipefail
          cargo run --release -p voice-hubert --example embed -- \
            samples/422-122949-0031.wav sources/features/422-122949-0031.npy

      - name: Đóng gói bundle
        run: |
          set -euo pipefail
          tar -czf voice-assets.tar.gz \
            sources/onnx_hubert_new sources/vits_dec sources/features \
            samples/422-122949-0031.wav
          ls -lh voice-assets.tar.gz

      - name: Publish lên Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Packaged model assets for voice-rs."
          gh release upload "$TAG" voice-assets.tar.gz --clobber
