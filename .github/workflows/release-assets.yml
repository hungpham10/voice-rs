name: release-assets

# Kéo MODEL nguồn (ngoài git) theo `scripts/asset_checksums.txt`, verify sha256,
# export trọng số `dec` từ `pretrained_ljs.pth`, rồi đóng gói 2 bundle CHỈ-MODEL
# và publish lên GitHub Release. Colab tải bundle bằng `scripts/fetch_assets.sh`.
#
# Không đụng tới dữ liệu/ground truth — người dùng tự tải dataset khi cần.
#
# Chạy tay: Actions → release-assets → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag để publish bundle"
        default: assets-v1

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kéo model nguồn + verify sha256
        run: |
          set -euo pipefail
          pip install --quiet gdown
          grep -vE '^[[:space:]]*(#|$)' scripts/asset_checksums.txt | \
          while read -r sha size dest url; do
            echo "→ $dest ($size bytes)"
            mkdir -p "sources/$(dirname "$dest")"
            if [[ "$url" == *drive.google.com* ]]; then
              gdown "$url" -O "sources/$dest"
            else
              curl -L --fail --retry 3 -o "sources/$dest" "$url"
            fi
            echo "$sha  sources/$dest" | sha256sum -c -
          done

      - name: Export trọng số dec (torch CPU)
        run: |
          set -euo pipefail
          pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu
          python scripts/export_vits_dec.py --hps scripts/ljs_base.json

      - name: Đóng gói bundle (chỉ model) + SHA256SUMS
        run: |
          set -euo pipefail
          make_bundle() { # <out.tar.gz> <staging-dir> <paths...>
            local out="$1" stage="$2"; shift 2
            rm -rf "$stage"; mkdir -p "$stage/sources"
            for p in "$@"; do cp -r "$p" "$stage/sources/"; done
            ( cd "$stage" && find sources -type f | sort | xargs sha256sum > SHA256SUMS )
            tar -czf "$out" -C "$stage" sources SHA256SUMS
            ls -lh "$out"
          }
          # main: ContentVec + VITS dec (đã export + ground truth ref_*.npz để verify)
          make_bundle voice-assets.tar.gz .pkg-main sources/onnx_hubert_new sources/vits_dec
          # f0: RMVPE
          make_bundle f0-assets.tar.gz .pkg-f0 sources/rmvpe.onnx

      - name: Publish lên Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Packaged model assets for voice-rs."
          gh release upload "$TAG" voice-assets.tar.gz f0-assets.tar.gz --clobber
