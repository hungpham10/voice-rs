name: release-assets

# Kéo MODEL nguồn (ngoài git) theo `scripts/asset_checksums.txt` từ HuggingFace,
# verify sha256, rồi đóng gói 2 bundle CHỈ-MODEL và publish lên GitHub Release.
# Colab tải bundle bằng `scripts/fetch_assets.sh`.
#
# HOÀN TOÀN RUST: không Python, không torch, không export — trọng số `vits_ljs_dec/*.npy`
# đã được export MỘT LẦN rồi đóng băng trên HF.
#
# Chạy tay: Actions → release-assets → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag để publish bundle"
        default: assets-v1

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kéo model nguồn từ HuggingFace + verify sha256
        run: |
          set -euo pipefail
          grep -vE '^[[:space:]]*(#|$)' scripts/asset_checksums.txt | \
          while read -r sha size dest url; do
            echo "→ $dest ($size bytes)"
            mkdir -p "sources/$(dirname "$dest")"
            curl -L --fail --retry 3 -o "sources/$dest" "$url"
            echo "$sha  sources/$dest" | sha256sum -c -
          done

      - name: Đóng gói bundle (chỉ model) + SHA256SUMS
        run: |
          set -euo pipefail
          make_bundle() { # <out.tar.gz> <staging-dir> <paths...>
            local out="$1" stage="$2"; shift 2
            rm -rf "$stage"; mkdir -p "$stage/sources"
            for p in "$@"; do cp -r "$p" "$stage/sources/"; done
            ( cd "$stage" && find sources -type f | sort | xargs sha256sum > SHA256SUMS )
            tar -czf "$out" -C "$stage" sources SHA256SUMS
            ls -lh "$out"
          }
          # main: ContentVec + VITS dec (trọng số + config + ground truth ref_*.npz)
          make_bundle voice-assets.tar.gz .pkg-main sources/contentvec sources/vits_ljs_dec
          # f0: RMVPE
          make_bundle f0-assets.tar.gz .pkg-f0 sources/rmvpe_f0.onnx

      - name: Publish lên Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Packaged model assets for voice-rs."
          gh release upload "$TAG" voice-assets.tar.gz f0-assets.tar.gz --clobber
