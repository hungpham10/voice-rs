name: ci

# Chỉ chạy UNIT TEST. `voice-train` giờ phụ thuộc `voice-hubert` (subcommand
# `voice embed`) nên cần model ContentVec ONNX lúc build — tải có CACHE, chỉ
# lần đầu chậm. `voice-f0` (rmvpe) vẫn không build trong CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # cargo unified feature graph: voice-train bật `cuda` làm default nên burn/cuda
  # được kích hoạt cho toàn bộ workspace lúc test cùng lúc. Ép CPU cho test để
  # tránh `Device::default()` fallback CUDA trên runner không có GPU NVIDIA.
  BURN_DEVICE: flex

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache sources/contentvec (ONNX cho voice-hubert build.rs)
        uses: actions/cache@v4
        with:
          path: sources/contentvec
          key: contentvec-768l12-onnx-v1
      - name: Fetch model assets (nếu cache hụt)
        run: ./scripts/fetch_assets.sh
      - name: Unit tests (voice-lib, voice-mel, voice-vits, voice-train)
        run: cargo test -p voice-lib -p voice-mel -p voice-vits -p voice-train
