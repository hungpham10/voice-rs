[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app (none — we ship raw binaries)
installers = []
# Target platforms to build apps for (Rust target-triple syntax).
# Colab runs x86_64 Linux, so that is the only one we need.
targets = ["x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Don't ship source code — binaries only.
source-tarball = false
# Steps injected into the `build-local-artifacts` job (relative to
# `.github/workflows/`): downloads the ONNX models and embeds the ContentVec
# weights into the `embed` binary.
github-build-setup = "../build-setup.yml"
